on:
  push:
    branches:
      - master  # Set a branch to deploy
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      # A newer push supersedes an older build instead of queueing behind it.
      # Safe here: the group covers the build only, so a deploy already under
      # way is never interrupted.
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          # Shallow: nothing here reads .GitInfo or .Lastmod (enableGitInfo is
          # unset), so the full history of this repo and of the 59 MB Blowfish
          # submodule is time spent for nothing.
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

# Deployment job
  deploy:
    # Only master publishes. Without this a pull_request build would push
    # straight to the live site, and would hold the github-pages environment
    # while doing it. workflow_dispatch on master still deploys.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
