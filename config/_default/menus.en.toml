# -- Main Menu --
# Rendered by layouts/partials/header/basic.html.
#
# "Our Products" expands into a dropdown of every product. That list is built
# from the products section at render time, not hardcoded here, so adding a
# product page is enough to put it in the menu.
#
# The individual certificate PDFs used to live here as a dropdown. They now have
# a page of their own (/certifications/), driven by data/certifications.toml, so
# they can carry an issuer, a year and an explanation instead of being bare links.

[[main]]
  name = "Our Products"
  pageRef = "products"
  weight = 10

[[main]]
  name = "Certifications"
  pageRef = "certifications"
  weight = 20

[[main]]
  name = "Contact"
  pageRef = "contact"
  weight = 30
