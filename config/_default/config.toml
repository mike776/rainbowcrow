# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/ Just Updaing the year

title = "Rainbow Crow"
theme = "blowfish"
baseURL = "https://rainbowcrow.com"
defaultContentLanguage = "en"
favicon = "icons/favicon.png"

# pluralizeListTitles = "true" # hugo function useful for non-english languages, find out more in  https://gohugo.io/getting-started/configuration/#pluralizelisttitles

enableRobotsTXT = true

[pagination]
pagerSize = 20
summaryLength = 30

buildDrafts = false
buildFuture = true

# googleAnalytics = "G-C6JEHTXMG2" # Rainbowcrow.com
[services.googleAnalytics]
  ID = "G-C6JEHTXMG2"


[imaging]
  anchor = 'Center'

[taxonomies]
  tag = "tags"
  category = "categories"
  author = "authors"
  series = "series"

[sitemap]
  changefreq = 'always'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]
